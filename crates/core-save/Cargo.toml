[package]
name = "core-save"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Read-only reader for The Binding of Isaac: Repentance+ save files"

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0.1"

[dev-dependencies]
# The examples name rows and columns with the project's one roster and header, which live in
# `ipc` (card #82, S2). A dev-dependency cycle is allowed: `ipc` links this library, and only
# the examples and tests link `ipc`.
ipc = { path = "../ipc" }
test-support = { path = "../test-support" }

[lints]
workspace = true
