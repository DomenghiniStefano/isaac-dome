[package]
name = "unpack"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Reader for The Binding of Isaac's ARCH000 archives, one entry at a time"

[dependencies]
miniz_oxide = "0.9.1"
serde = { version = "1", features = ["derive"] }

[features]
# The `for_tests` module and the API only tests reach, kept out of the release build
# (card #81, C8). The crate's own tests turn it on through the self-reference below.
test-api = []

[dev-dependencies]
unpack = { path = ".", features = ["test-api"] }
test-support = { path = "../test-support" }
tempfile = "3"

[lints]
workspace = true
