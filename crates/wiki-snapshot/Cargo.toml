[package]
name = "wiki-snapshot"
version = "0.1.0"
edition = "2021"
description = "Developer tool: downloads the raw wiki snapshot and builds the dataset"

[dependencies]
wiki = { path = "../wiki", default-features = false }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
