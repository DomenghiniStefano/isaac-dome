[package]
name = "wiki"
version = "0.1.0"
edition = "2021"
description = "Dataset derivato dalla wiki: parser del wikitext e albero tipizzato"

[features]
default = ["embedded"]
# Incorpora `dataset/wiki.json` (compresso da build.rs) e espone `Dataset::embedded`. Il tool
# `wiki-snapshot`, che quel file lo produce, compila senza.
embedded = ["dep:miniz_oxide"]

[dependencies]
miniz_oxide = { version = "0.9.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
miniz_oxide = "0.9.1"

[dev-dependencies]
tempfile = "3"
