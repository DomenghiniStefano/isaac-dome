[package]
name = "wiki"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Dataset derived from the wiki: wikitext parser and typed tree"

[features]
default = ["embedded"]
# Embeds `dataset/wiki.json` (compressed by build.rs) and exposes `Dataset::embedded`. The
# `wiki-snapshot` tool, which is what produces that file, compiles without it.
embedded = ["dep:miniz_oxide"]

[dependencies]
miniz_oxide = { version = "0.9.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"

[build-dependencies]
miniz_oxide = "0.9.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
