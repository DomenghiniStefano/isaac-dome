[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "IsaacDome — applicazione desktop"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "isaac-dome"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipc = { path = "../ipc" }
discovery = { path = "../discovery" }
core-save = { path = "../core-save" }
unpack = { path = "../unpack" }
catalog = { path = "../catalog" }
store = { path = "../store" }
wiki = { path = "../wiki" }
