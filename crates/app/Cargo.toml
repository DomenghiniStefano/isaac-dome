[package]
name = "app"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "IsaacDome — applicazione desktop"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "isaac-dome"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipc = { path = "../ipc" }
discovery = { path = "../discovery" }
core-save = { path = "../core-save" }
unpack = { path = "../unpack" }
catalog = { path = "../catalog" }
graph = { path = "../graph" }
plan = { path = "../plan" }
store = { path = "../store" }
log-watch = { path = "../log-watch" }
run = { path = "../run" }
wiki = { path = "../wiki" }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-notification = "2.4.0"
sys-locale = "0.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
