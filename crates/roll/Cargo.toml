[package]
name = "roll"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The draw: the completion space, the deck a preset leaves in it, and the saved document"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The API only tests reach, kept out of the release build. The crate's own tests turn it on
# through the self-reference below.
test-api = []

[dev-dependencies]
roll = { path = ".", features = ["test-api"] }

[lints]
workspace = true
