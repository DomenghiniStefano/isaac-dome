[package]
name = "store"
version = "0.1.0"
edition = "2021"
description = "Persistenza dell'app: un file SQLite, schema versionato. Scrive solo nel proprio file."

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipc = { path = "../ipc" }
plan = { path = "../plan" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
