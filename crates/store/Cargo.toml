[package]
name = "store"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The app's persistence: one SQLite file, versioned schema. It writes only to its own file."

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipc = { path = "../ipc" }
run = { path = "../run" }
plan = { path = "../plan" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
