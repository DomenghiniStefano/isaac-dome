[package]
name = "catalog"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Normalizes the game's XML into a catalog queryable by id. Pure: bytes in, model out."

[dependencies]
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
test-support = { path = "../test-support" }
unpack = { path = "../unpack" }
core-save = { path = "../core-save" }
