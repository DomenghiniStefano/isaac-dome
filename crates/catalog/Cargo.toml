[package]
name = "catalog"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Normalizes the game's XML into a catalog queryable by id. Pure: bytes in, model out."

[dependencies]
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0.1"

[features]
# The API only tests reach, kept out of the release build
# (card #81, C8). The crate's own tests turn it on through the self-reference below.
test-api = []

[dev-dependencies]
catalog = { path = ".", features = ["test-api"] }
test-support = { path = "../test-support" }
unpack = { path = "../unpack" }
core-save = { path = "../core-save" }

[lints]
workspace = true
