[package]
name = "discovery"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Locates Steam, the Isaac game and the saves on any PC"

[dependencies]
dirs = "6.0.0"
keyvalues-parser = "0.2.4"
serde = { version = "1", features = ["derive"] }
steamlocate = "2.1.1"
ts-rs = "12.0.1"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
test-support = { path = "../test-support" }
tempfile = "3.27.0"

[lints]
workspace = true
