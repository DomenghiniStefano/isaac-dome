[package]
name = "graph"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Unlock graph: typed requirements, curated verdicts, evaluation against a profile"

[dependencies]
catalog = { path = "../catalog" }
wiki = { path = "../wiki" }
core-save = { path = "../core-save" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"

[features]
# The `for_tests` module and the API only tests reach, kept out of the release build
# (card #81, C8). The crate's own tests turn it on through the self-reference below.
test-api = []

[dev-dependencies]
wiki = { path = "../wiki", features = ["test-api"] }
graph = { path = ".", features = ["test-api"] }
test-support = { path = "../test-support" }
unpack = { path = "../unpack" }

[lints]
workspace = true
