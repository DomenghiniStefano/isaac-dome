[package]
name = "log-watch"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Reads the game's logs from disk: an offset, a read, and a watcher. Every judgment lives in `run`."

[dependencies]
notify = "8"
run = { path = "../run" }
store = { path = "../store" }

[features]
# The API only tests reach, kept out of the release build (card #81, C8). The crate's own
# tests turn it on through the self-reference below.
test-api = []

[dev-dependencies]
log-watch = { path = ".", features = ["test-api"] }
tempfile = "3"
test-support = { path = "../test-support" }

[lints]
workspace = true
