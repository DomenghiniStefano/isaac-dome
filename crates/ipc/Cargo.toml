[package]
name = "ipc"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "View-models for the interface: from discovery and core-save to already-resolved JSON"

[dependencies]
serde = { version = "1", features = ["derive"] }
discovery = { path = "../discovery" }
core-save = { path = "../core-save" }
unpack = { path = "../unpack" }
catalog = { path = "../catalog" }
run = { path = "../run" }
graph = { path = "../graph" }
plan = { path = "../plan" }
floor = { path = "../floor" }
wiki = { path = "../wiki" }
roll = { path = "../roll" }
png = "0.17"
ts-rs = "12.0.1"

[features]
# The `for_tests` module and the API only tests reach, kept out of the release build
# (card #81, C8). The crate's own tests turn it on through the self-reference below.
test-api = []

[dev-dependencies]
wiki = { path = "../wiki", features = ["test-api"] }
graph = { path = "../graph", features = ["test-api"] }
ipc = { path = ".", features = ["test-api"] }
test-support = { path = "../test-support" }
serde_json = "1"

[lints]
workspace = true
