[package]
name = "ipc"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "View-models for the interface: from discovery and core-save to already-resolved JSON"

[dependencies]
serde = { version = "1", features = ["derive"] }
discovery = { path = "../discovery" }
core-save = { path = "../core-save" }
unpack = { path = "../unpack" }
catalog = { path = "../catalog" }
run = { path = "../run" }
graph = { path = "../graph" }
plan = { path = "../plan" }
floor = { path = "../floor" }
wiki = { path = "../wiki" }
roll = { path = "../roll" }
png = "0.17"
ts-rs = "12.0.1"

[dev-dependencies]
test-support = { path = "../test-support" }
serde_json = "1"

[lints]
workspace = true
