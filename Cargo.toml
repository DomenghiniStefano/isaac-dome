[workspace]
resolver = "2"
members = ["crates/*"]

# Declared once and inherited by every crate with `license.workspace = true`, so the
# repo can't end up with two answers to the same question. The code is GPL-3.0-only;
# the wiki dataset under `dataset/` is not covered by it and keeps the CC BY-SA 4.0 of
# the source it derives from — see `LICENSE` and `dataset/ATTRIBUTION.md`.
[workspace.package]
license = "GPL-3.0-only"
